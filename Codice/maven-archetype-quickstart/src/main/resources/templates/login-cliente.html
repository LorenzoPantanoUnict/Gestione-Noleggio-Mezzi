<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Cliente - Noleggio Mezzi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-login:hover { background-color: #0056b3; }
        .error-msg { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 0.9em; text-align: center; }
        .register-link { text-align: center; margin-top: 20px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>🔑 Accesso Clienti</h1>
    
    <div th:if="${errore}" class="error-msg" th:text="${errore}"></div>

    <form action="/login-cliente" method="post">
        <div class="form-group">
            <label>Indirizzo Email:</label>
            <input type="email" name="email" required placeholder="Inserisci la tua email">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" required placeholder="Inserisci la tua password">
        </div>
        <button type="submit" class="btn-login">Accedi e Prenota</button>
    </form>

    <div class="register-link">
        Non hai un account? <a href="/registra-cliente">Registrati qui</a>
    </div>
</div>

</body>
</html>
