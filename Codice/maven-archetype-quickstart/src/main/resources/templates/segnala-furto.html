<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Segnala Furto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #d9534f; }
        select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 20px; background-color: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .error { color: #a94442; background-color: #f2dede; padding: 15px; margin-bottom: 20px; border: 1px solid #ebccd1; }
    </style>
</head>
<body>
    <h1>🚨 Segnalazione Furto Mezzo</h1>
    <p>Attenzione: questa operazione cambierà lo stato del mezzo e procederà all'addebito delle perdite.</p>

    <div th:if="${param.error}" class="error">
        ❌ Errore nella segnalazione. Verifica che l'ID noleggio sia corretto o che il cliente abbia saldo sufficiente.
    </div>

    <form action="/segnala-furto" method="post">
        <div class="form-group">
            <label for="noleggioId">Noleggio Interessato:</label>
            <select id="noleggioId" name="noleggioId" required>
                <option value="" disabled selected>-- Seleziona il noleggio --</option>
                <option th:each="n : ${noleggiAttivi}" 
                        th:value="${n.id}" 
                        th:text="'Noleggio #' + ${n.id} + ' - ' + ${n.cliente.cognome} + ' (' + ${n.mezzo.descrizione.marca} + ')'">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="descrizione">Dettagli dell'evento:</label>
            <textarea id="descrizione" name="descrizione" rows="4" required 
                      placeholder="Inserire data, luogo e dinamica del furto..."></textarea>
        </div>

        <button type="submit">Invia Segnalazione e Addebita</button>
    </form>
    <br>
    <a href="/catalogo">⬅ Annulla e torna al Catalogo</a>
</body>
</html>
