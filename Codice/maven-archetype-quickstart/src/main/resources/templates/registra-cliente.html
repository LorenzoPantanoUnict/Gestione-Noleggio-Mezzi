<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registra Nuovo Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px;}
        input { width: 100%; padding: 8px; box-sizing: border-box;}
        button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px;}
        button:hover { background: #218838; }
        .error { color: #721c24; background-color: #f8d7da; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .success { color: #155724; background-color: #d4edda; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>👤 Registra Cliente</h1>
    <p>Inserisci i dati del nuovo cliente per aggiungerlo al sistema.</p>
    
    <div th:if="${param.error}" class="error">
        ❌ Errore durante la registrazione! Controlla che l'email sia valida o che non sia già usata.
    </div>

    <div th:if="${param.success}" class="success">
        ✅ Cliente registrato con successo! Puoi inserirne un altro.
    </div>

    <form action="/registra-cliente" method="post">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Es. Mario">
        </div>
        
        <div class="form-group">
            <label for="cognome">Cognome:</label>
            <input type="text" id="cognome" name="cognome" required placeholder="Es. Rossi">
        </div>
        
        <div class="form-group">
            <label for="email">Indirizzo Email:</label>
            <input type="email" id="email" name="email" required placeholder="Es. mario.rossi@email.it">
        </div>
        
        <button type="submit">Salva Cliente</button>
    </form>

</body>
</html>
