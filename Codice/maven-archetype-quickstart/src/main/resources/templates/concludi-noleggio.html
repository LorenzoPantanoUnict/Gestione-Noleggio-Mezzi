<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Concludi Noleggio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 700px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .success { color: green; margin-bottom: 20px; font-weight: bold; }
        .error { color: red; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🏁 Conclusione Noleggio</h1>

    <div th:if="${param.success}" class="success">✅ Noleggio concluso e pagamento effettuato con successo!</div>
    <div th:if="${param.error}" class="error">❌ Errore durante la chiusura. Controlla i KM o il saldo del cliente.</div>

    <form action="/concludi-noleggio" method="post">
        <div class="form-group">
            <label>Seleziona Noleggio Attivo:</label>
            <select name="noleggioId" required>
                <option value="" disabled selected>-- Seleziona un noleggio --</option>
                <option th:each="n : ${noleggiAttivi}" 
                        th:value="${n.id}" 
                        th:text="'ID: ' + ${n.id} + ' - ' + ${n.cliente.cognome} + ' (' + ${n.mezzo.descrizione.marca} + ')'">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Chilometri Finali:</label>
            <input type="number" name="kmFinali" required min="0">
        </div>

        <div class="form-group">
            <label>Livello Carica Residua (0.0 - 100.0):</label>
            <input type="number" name="livelloCarica" step="0.1" min="0" max="1" required>
        </div>

        <button type="submit">Calcola Costo e Chiudi</button>
    </form>
    <br>
    <a href="/catalogo">⬅ Torna al Catalogo</a>
</body>
</html>
